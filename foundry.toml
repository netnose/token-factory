[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./" }]

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532, url = "https://api-sepolia.basescan.org/api" }

[fmt]
line_length = 120

[lint]
lint_on_build = false

[invariant]
runs = 64
depth = 64
fail_on_revert = true

# Heavier fuzzing in CI (FOUNDRY_PROFILE=ci).
[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 256
depth = 128
fail_on_revert = true
